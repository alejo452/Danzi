name: APK de Android

# Compila la app para Android (Capacitor), con la misma app web que se publica en GitHub Pages.
# - En cada push a main, la APK normal («Danzi») se firma con la llave del secreto DANZI_FIRMA_ANDROID
#   y se publica en Releases. Enlace fijo para descargarla en el celular:
#   https://github.com/<usuario>/<repo>/releases/latest/download/danzi.apk
# - En cada pull request se compila la versión de pruebas («Danzi Pruebas»), que se instala al lado de la
#   normal con su propio progreso. Se firma con la llave de pruebas (.github/pruebas, pública a propósito), así
#   que una nueva se instala encima de la anterior. Queda como artefacto (danzi-pruebas) con su parte web y su
#   aviso, y el workflow «Versiones de prueba» (pruebas.yml) la publica en Releases como pruebas-pr-<número>.
# La llave solo llega al paso que compila la APK normal. Antes de publicar se comprueba que la APK quedó
# firmada con la llave de siempre (android/firma-sha256.txt): con otra, Android no la deja instalar encima.
# Junto a la APK se publican la parte web (danzi-web.zip) y el aviso actualizacion.json: con ellos, la APK
# instalada se actualiza sola sin reinstalar (src/native/updates.ts), salvo cuando cambia la parte de Android.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Huella de la parte de Android
        run: echo "DANZI_HUELLA=$(node scripts/update-manifest.mjs --huella)" >> "$GITHUB_ENV"
      - name: Compilar la app web
        env:
          DANZI_VERSION: ${{ github.run_number }}
          # La versión de prueba sabe de qué pull request sale: Danzi Pruebas sigue sus versiones nuevas.
          DANZI_PR: ${{ github.event.pull_request.number }}
        run: npm run build
      - run: npx cap sync android
      - name: Compilar Danzi Pruebas
        working-directory: android
        env:
          N: ${{ github.run_number }}
        run: ./gradlew assembleDebug -PversionCode="$N" -PversionName="1.$N" --console=plain
      - name: Firmar con la llave de pruebas
        run: |
          # Todas las versiones de prueba llevan la misma firma: una nueva se instala encima de la anterior.
          # La llave (.github/pruebas) es pública a propósito y solo sirve para «Danzi Pruebas».
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" sign --ks .github/pruebas/danzi-pruebas.p12 --ks-pass pass:danzi-pruebas --ks-key-alias pruebas --out danzi-pruebas.apk android/app/build/outputs/apk/debug/app-debug.apk
          got="$("$apksigner" verify --print-certs danzi-pruebas.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          want="$(tr -d '[:space:]' < .github/pruebas/firma-sha256.txt)"
          echo "Huella de la APK de prueba: ${got:-ninguna}. Huella esperada: $want"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::La APK de prueba no quedó firmada con la llave de pruebas (.github/pruebas/firma-sha256.txt)."
            exit 1
          fi
      - name: Preparar la versión de prueba
        env:
          N: ${{ github.run_number }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          (cd dist && zip -qr -X ../danzi-web.zip .)
          node scripts/update-manifest.mjs "$N" danzi-web.zip --pruebas "$PR" > actualizacion.json
          cat actualizacion.json
      - uses: actions/upload-artifact@v4
        with:
          name: danzi-pruebas
          path: |
            danzi-pruebas.apk
            danzi-web.zip
            actualizacion.json
          retention-days: 14

  publicar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - name: Huella de la parte de Android
        run: echo "DANZI_HUELLA=$(node scripts/update-manifest.mjs --huella)" >> "$GITHUB_ENV"
      - name: Compilar la app web
        env:
          # La misma versión de la APK (1.<número>): la app la usa para saber si hay una versión más nueva.
          DANZI_VERSION: ${{ github.run_number }}
        run: npm run build
      - run: npx cap sync android
      - name: Compilar Danzi firmada
        working-directory: android
        env:
          N: ${{ github.run_number }}
          DANZI_FIRMA_ANDROID: ${{ secrets.DANZI_FIRMA_ANDROID }}
        run: |
          if [ -z "$DANZI_FIRMA_ANDROID" ]; then
            echo "::error::Falta el secreto DANZI_FIRMA_ANDROID. Créalo en Settings › Secrets and variables › Actions con el código de la llave de firma (README, sección «App para Android»)."
            exit 1
          fi
          ./gradlew assembleRelease -PversionCode="$N" -PversionName="1.$N" --console=plain
          rm -rf app/build/firma
      - name: Comprobar la firma
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          # Según la versión, apksigner escribe «Signer #1 certificate SHA-256 digest: …» o
          # «V2 Signer: certificate SHA-256 digest: …». Todas las firmas deben tener la misma huella.
          got="$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          want="$(tr -d '[:space:]' < android/firma-sha256.txt)"
          echo "Huella de la APK: ${got:-ninguna}. Huella esperada: $want"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::La APK no quedó firmada con la llave de siempre (android/firma-sha256.txt). Con otra llave, Android no deja instalarla encima de la anterior. Revisa el secreto DANZI_FIRMA_ANDROID."
            exit 1
          fi
          mv android/app/build/outputs/apk/release/app-release.apk danzi.apk
      - name: Preparar la actualización automática
        env:
          N: ${{ github.run_number }}
        run: |
          # La parte web de esta versión (la misma que va dentro de la APK) y su aviso. El aviso de la versión
          # anterior dice si cambió la parte de Android: si no cambió, las APK instaladas la reciben solas.
          (cd dist && zip -qr -X ../danzi-web.zip .)
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/actualizacion.json" -o anterior.json || rm -f anterior.json
          node scripts/update-manifest.mjs "$N" danzi-web.zip anterior.json > actualizacion.json
          cat actualizacion.json
          ls -l danzi-web.zip
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          # En un merge, la segunda línea del mensaje es el título del pull request.
          cambios="$(git log -1 --format=%b | sed -n '1p')"
          [ -n "$cambios" ] || cambios="$(git log -1 --format=%s)"
          minima="$(node -p 'require("./actualizacion.json").apkMinima')"
          notas="Si ya tienes Danzi 1.${minima} o una más reciente, no hace falta descargar nada: se actualiza sola al abrirla.

          Para instalarla o actualizarla desde el celular, toca danzi.apk aquí abajo. Si ya tienes Danzi, se instala encima sin perder el progreso. Nunca la desinstales: desinstalarla borra el progreso.

          Cambios: ${cambios}"
          gh release create "android-$N" danzi.apk danzi-web.zip actualizacion.json --target "$GITHUB_SHA" --latest --title "Danzi para Android · versión 1.$N" --notes "$notas"
